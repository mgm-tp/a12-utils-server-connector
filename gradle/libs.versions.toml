[versions]
jackson = "3.2.1"
spring = "7.0.8"
springBoot = "4.1.0"
annotationApi = "2.1.1"
validationApi = "3.0.2"
inject = "2.0.1"
hibernateValidator = "8.0.1.Final"
junit = "5.10.2"
junitPlatform = "1.10.2"
mockito = "5.2.0"
mockito-junit = "5.11.0"
hamcrest = "2.2"
slf = "2.0.13"
httpClient5 = "5.6.1"
okhttp = "4.12.0"

[libraries]
jacksondataBind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
springWeb = { module = "org.springframework:spring-web", version.ref = "spring" }
annotationApi = { module = "jakarta.annotation:jakarta.annotation-api", version.ref = "annotationApi" }
validationApi = { module = "jakarta.validation:jakarta.validation-api", version.ref = "validationApi" }
inject = { module = "jakarta.inject:jakarta.inject-api", version.ref = "inject" }
hibernateValidator = { module = "org.hibernate.validator:hibernate-validator", version.ref = "hibernateValidator" }
springTest = { module = "org.springframework:spring-test", version.ref = "spring" }
junitJupterApi = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junitJupterEngine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junitJupterPlatformEngine = { module = "org.junit.platform:junit-platform-engine", version.ref = "junitPlatform" }
junitPlatformLauncher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" }
mockitoInline = { module = "org.mockito:mockito-inline", version.ref = "mockito" }
mockitoJunit = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito-junit" }
hamcrestCore = { module = "org.hamcrest:hamcrest-core", version.ref = "hamcrest" }
hamcrestLib = { module = "org.hamcrest:hamcrest-library", version.ref = "hamcrest" }
log4j12 = { module = "org.slf4j:slf4j-log4j12", version.ref = "slf" }
slf = { module = "org.slf4j:slf4j-api", version.ref = "slf" }
springBootAutoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure", version.ref = "springBoot" }
springBootConfigProcessor = { module = "org.springframework.boot:spring-boot-configuration-processor", version.ref = "springBoot" }
springBootStarterWeb = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "springBoot" }
httpClient5 = { module = "org.apache.httpcomponents.client5:httpclient5", version.ref = "httpClient5" }
okhttpTls = { module = "com.squareup.okhttp3:okhttp-tls", version.ref = "okhttp" }
okhttpMockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
[bundles]
springTest = ["springTest", "junitJupterApi", "junitJupterEngine","junitPlatformLauncher","junitJupterPlatformEngine","mockitoInline","mockitoJunit","hamcrestCore","hamcrestLib","log4j12","slf","jacksondataBind"]
